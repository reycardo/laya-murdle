[project]
name = "laya-murdle"
version = "0.1.0"
description = "Parse murdle.com puzzles with Laya and solve them with a constraint solver"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "laya>=0.3.20",
    "python-constraint>=1.4.0",
]

[project.optional-dependencies]
render = ["playwright>=1.47"]

[project.scripts]
laya-murdle = "laya_murdle.main:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
